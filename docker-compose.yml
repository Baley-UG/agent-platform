services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkeythatshouldbechangedforproduction}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: always

  tiktok-ads-mcp:
    build:
      context: .
      dockerfile: docker/tiktok-ads-mcp.Dockerfile
    env_file:
      - .env
    environment:
      - TIKTOK_APP_ID=${TIKTOK_APP_ID}
      - TIKTOK_APP_SECRET=${TIKTOK_APP_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI}
      - TIKTOK_ADVERTISER_ID=${TIKTOK_ADVERTISER_ID}
      - HOST=0.0.0.0
      - PORT=8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # --------------------------------------------------------------------
  # ig_scraper microservice — three roles, same image
  # --------------------------------------------------------------------
  ig-scraper-api:
    build:
      context: ./services/ig_scraper
      args:
        APP_ENV: ${APP_ENV:-development}
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
    ports:
      # Host-side port overridable via IG_SCRAPER_HOST_PORT in .env
      # so we can sidestep collisions without editing this file.
      - "${IG_SCRAPER_HOST_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - monitoring

  ig-scraper-worker:
    build:
      context: ./services/ig_scraper
      args:
        APP_ENV: ${APP_ENV:-development}
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring

  ig-scraper-scheduler:
    build:
      context: ./services/ig_scraper
      args:
        APP_ENV: ${APP_ENV:-development}
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring

  # --------------------------------------------------------------------
  # Redis — shared queue/cache for content_pipeline (RQ).
  # ig_scraper does not use Redis; this is here for content_pipeline.
  # --------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - monitoring

  # --------------------------------------------------------------------
  # content_pipeline microservice — four roles, two images
  # --------------------------------------------------------------------
  content-pipeline-api:
    build:
      context: ./services/content_pipeline
      args:
        APP_ENV: ${APP_ENV:-development}
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - REDIS_HOST=${REDIS_HOST:-redis}
    ports:
      - "${CP_HOST_PORT:-8082}:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - monitoring

  content-pipeline-worker:
    build:
      context: ./services/content_pipeline
      args:
        APP_ENV: ${APP_ENV:-development}
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring

  content-pipeline-render:
    build:
      context: ./services/content_pipeline
      dockerfile: Dockerfile.ffmpeg
      args:
        APP_ENV: ${APP_ENV:-development}
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring

  content-pipeline-scheduler:
    build:
      context: ./services/content_pipeline
      args:
        APP_ENV: ${APP_ENV:-development}
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring


networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
  redis-data: