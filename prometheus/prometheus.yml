global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['app:8000']

  # ad_scraper runs as TWO processes and the interesting counters are in the
  # worker: it is what fetches pages, hits rate limits and waits at the
  # throttle. Scraping only the API would report 0 for all of them forever.
  - job_name: 'ad-scraper-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ad-scraper-api:8083']

  - job_name: 'ad-scraper-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ad-scraper-worker:9103']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
