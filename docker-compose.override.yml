## Development overrides — automatically merged into docker-compose.yml.
##
## Volume-mounts the source code into the running containers so edits
## reflect without rebuilding the image:
##   - API: uvicorn `--reload` watches files and restarts in ~1s.
##   - Worker / Scheduler: no built-in reload, but `docker compose
##     restart ig-scraper-worker` picks up the new code instantly
##     because /app/app is the mounted host directory.
##
## Trade-offs:
##   - Production should NOT use this file (it disables image
##     immutability and exposes host paths). Strip via:
##       docker compose -f docker-compose.yml up -d   # explicit, no override
##
## When you DO need to rebuild:
##   - Changed `services/ig_scraper/pyproject.toml`  → rebuild api/worker/scheduler.
##   - Changed `services/ig_scraper/Dockerfile`      → rebuild api/worker/scheduler.
##   - Pure Python edits under `services/ig_scraper/app/` → no rebuild needed.

services:
  ig-scraper-api:
    volumes:
      - ./services/ig_scraper/app:/app/app
      - ./services/ig_scraper/alembic:/app/alembic
      - ./services/ig_scraper/alembic.ini:/app/alembic.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload", "--reload-dir", "/app/app"]
    # CP-M9 dev-only — published on host for direct curl/debug. In prod,
    # main `app/` gateway is the only public surface.
    ports:
      - "${IG_SCRAPER_HOST_PORT:-127.0.0.1:8081}:8081"

  ig-scraper-worker:
    volumes:
      - ./services/ig_scraper/app:/app/app

  ig-scraper-scheduler:
    volumes:
      - ./services/ig_scraper/app:/app/app

  # ------------------------------------------------------------------
  # content_pipeline — hot-reload + MinIO for dev S3-compatible storage
  # ------------------------------------------------------------------
  content-pipeline-api:
    volumes:
      - ./services/content_pipeline/app:/app/app
      - ./services/content_pipeline/alembic:/app/alembic
      - ./services/content_pipeline/alembic.ini:/app/alembic.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8082", "--reload", "--reload-dir", "/app/app"]
    # CP-M9 dev-only — published on host for direct curl/debug. In prod,
    # main `app/` gateway is the only public surface.
    ports:
      - "${CP_HOST_PORT:-127.0.0.1:8082}:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  content-pipeline-worker:
    volumes:
      - ./services/content_pipeline/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  content-pipeline-render:
    # Dev: run the new remake_ffmpeg queue without waiting on an
    # image rebuild (bind-mounted code is already current; only the
    # Dockerfile CMD lags). Prod uses the Dockerfile.ffmpeg CMD.
    command: ["python", "-m", "app.worker", "--queues", "remake_ffmpeg"]
    volumes:
      - ./services/content_pipeline/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  content-pipeline-scheduler:
    volumes:
      - ./services/content_pipeline/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # ad_scraper — hot-reload + host-published port for direct curl/debug.
  # In prod the main `app/` gateway is the only public surface.
  # ------------------------------------------------------------------
  ad-scraper-api:
    volumes:
      - ./services/ad_scraper/app:/app/app
      - ./services/ad_scraper/alembic:/app/alembic
      - ./services/ad_scraper/alembic.ini:/app/alembic.ini
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8083", "--reload", "--reload-dir", "/app/app"]
    ports:
      - "${AD_SCRAPER_HOST_PORT:-127.0.0.1:8083}:8083"

  ad-scraper-worker:
    volumes:
      - ./services/ad_scraper/app:/app/app
