[project]
name = "ig-scraper"
version = "0.1.0"
description = "Instagram competitor scraper microservice — feeds raw and scored content to the agent-platform AI generation pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "sqlmodel>=0.0.24",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "structlog>=25.2.0",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    "slowapi>=0.1.9",
    "cryptography>=43.0.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "instagrapi>=2.1.0",
    "pillow>=10.0.0",
    "langdetect>=1.0.9",
    "mcp>=1.6.0",
    # S3 mirror of scraped media; shares the bucket with content_pipeline.
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = ["black", "ruff", "pytest>=8.3.5", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 119
exclude = "venv|migrations|.venv"

[tool.ruff]
line-length = 119
exclude = ["migrations", "alembic/versions", "*.ipynb", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "ERA", "D"]
ignore = ["E501", "F401", "D203", "D213", "B904", "B008", "D100", "D104"]
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"alembic/**" = ["D"]
